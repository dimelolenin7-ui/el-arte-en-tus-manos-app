<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Arte en Tus Manos | Academia de Amigurumis y Manualidades</title>
  
  <meta name="theme-color" content="#b35a38">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="IMG-20261103-WA0013.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- YOUTUBE IFRAME API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg: #fbf8f4;
      --card-bg: #ffffff;
      --primary: #b35a38;
      --primary-hover: #984627;
      --primary-soft: #fcf1eb;
      --accent: #5e7a68;
      --accent-soft: #eef4f0;
      --text: #2d2621;
      --text-muted: #7d7268;
      --border: #ede4d8;
      --gold: #d4a373;
      --shadow-sm: 0 2px 8px rgba(92, 60, 42, 0.05);
      --shadow-md: 0 4px 16px rgba(92, 60, 42, 0.08);
      --radius-md: 14px;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, .font-serif {
      font-family: 'Cinzel', serif;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px;
      width: 100%;
    }

    .btn-install-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #b35a38, #d4a373);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(179, 90, 56, 0.25);
      margin-bottom: 14px;
      width: 100%;
      text-align: center;
    }

    .btn-install-banner:active { transform: scale(0.98); }

    /* NUBE GUÍA LOGIN */
    .onboarding-cloud-box {
      background: #fff;
      border: 2px solid var(--primary);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      position: relative;
      box-shadow: 0 6px 18px rgba(179, 90, 56, 0.15);
      text-align: left;
      animation: floatCloud 3s ease-in-out infinite;
    }

    @keyframes floatCloud {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .cloud-title {
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .cloud-desc {
      font-size: 0.76rem;
      color: var(--text);
      line-height: 1.35;
    }

    .cloud-btn-close {
      display: inline-block;
      margin-top: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* PANTALLA LOGIN */
    #authScreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .auth-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 450px;
      text-align: center;
      padding: 28px 20px 24px;
      position: relative;
    }

    .brand-logo-main {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 14px;
      box-shadow: 0 6px 18px rgba(179, 90, 56, 0.18);
      border: 3px solid #fff;
    }

    .auth-card h1 {
      font-size: 1.45rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .auth-card p {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .auth-tabs {
      display: flex;
      background: #faf8f5;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      gap: 4px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 0.78rem;
      font-weight: 700;
      border: none;
      background: none;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .auth-tab-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .input-group {
      text-align: left;
      margin-bottom: 12px;
    }

    .input-group label {
      font-size: 0.78rem;
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.92rem;
      outline: none;
      background: #faf8f5;
      font-family: inherit;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .btn-main {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(179, 90, 56, 0.22);
    }

    .btn-view-plans-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      color: #1b5e20;
      background: #e8f5e9;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(251, 248, 244, 0.96);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--primary-soft);
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
    }

    .user-plan-badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .badge-free { background: #eee; color: #666; }
    .badge-pro { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .badge-premium { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-top {
      background: #fff;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }

    .btn-top.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-plans-nav {
      background: #fff8e1;
      border: 1px solid #ffe082;
      color: #b78103;
      font-weight: 700;
    }

    .btn-suggest-nav {
      background: #fdf4ff;
      border: 1px solid #f0abfc;
      color: #86198f;
      font-weight: 700;
    }

    .btn-help-nav {
      background: #eef4f0;
      border: 1px solid #c8e6c9;
      color: var(--accent);
      font-weight: 700;
    }

    .btn-admin {
      background: #2d2621;
      color: #fff;
      border: none;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .vip-upgrade-card {
      background: linear-gradient(135deg, #fff7ed, #ffedd5);
      border: 1px solid #fed7aa;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .vip-upgrade-card h4 {
      font-size: 0.88rem;
      color: #9a3412;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .vip-upgrade-card p {
      font-size: 0.75rem;
      color: #7c2d12;
    }

    .btn-claim-pill {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* BUSCADOR */
    .search-bar {
      position: relative;
      margin: 8px 0 10px;
    }

    .search-bar input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* PÍLDORAS */
    .pill-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 14px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .pill-filters::-webkit-scrollbar { display: none; }

    .pill-btn {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ETIQUETA NUEVO */
    .tag-new-course {
      display: inline-block;
      background: #86198f;
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 6px;
      letter-spacing: 0.5px;
      vertical-align: middle;
      text-transform: uppercase;
    }

    /* MÓDULOS DE CURSOS PLEGABLES */
    .course-module-box {
      background: #fff;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .course-header-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: #fff;
      cursor: pointer;
      user-select: none;
    }

    .course-header-toggle:hover { background: #faf8f5; }

    .course-header-left {
      flex: 1;
      padding-right: 10px;
    }

    .course-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.25;
    }

    .course-meta-txt {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 600;
    }

    .course-arrow-icon {
      font-size: 0.85rem;
      color: var(--primary);
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary-soft);
    }

    .course-module-box.open .course-arrow-icon { transform: rotate(180deg); }

    .course-content-body {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid #f0ebe4;
    }

    .course-module-box.open .course-content-body { display: block; }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background: #ede4d8;
      border-radius: 10px;
      overflow: hidden;
      margin: 14px 0 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .course-lesson-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      background: #faf8f5;
      cursor: pointer;
      position: relative;
    }

    .course-lesson-item.locked {
      background: #f3f0ec;
      opacity: 0.85;
      border-style: dashed;
    }

    .course-lesson-item.done {
      border-color: #c8e6c9;
      background: #f1f8f3;
    }

    .lesson-thumb {
      width: 60px;
      height: 42px;
      border-radius: 6px;
      object-fit: cover;
    }

    .lesson-thumb.blur { filter: grayscale(80%) blur(1px); }

    /* CARRUSELES Y TARJETAS */
    .section-head {
      margin: 18px 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-head h2 {
      font-size: 1.05rem;
      color: var(--text);
    }

    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar { display: none; }

    .video-card {
      min-width: 205px;
      max-width: 205px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      scroll-snap-align: start;
      position: relative;
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      height: 120px;
      background: #111;
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tag-duration {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tag-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(255, 255, 255, 0.95);
      color: var(--text);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .lock-overlay-badge {
      position: absolute;
      inset: 0;
      background: rgba(28, 20, 16, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      backdrop-filter: blur(2px);
      gap: 4px;
    }

    .card-fav-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
      z-index: 2;
    }

    .card-info { padding: 10px; }

    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    /* FOOTER DL COMPANY */
    .dl-footer {
      background: #0f0f11;
      color: #9c9a97;
      text-align: center;
      padding: 24px 16px;
      margin-top: auto;
      border-top: 1px solid #202022;
    }

    .dl-footer-logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .dl-footer p {
      font-size: 0.72rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .dl-footer .dl-brand {
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* MODALES */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      overflow-y: auto;
      padding: 14px;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 18px;
      max-width: 560px;
      margin: 10px auto;
      overflow: hidden;
      position: relative;
    }

    .video-frame-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    #player { width: 100%; height: 100%; }

    .time-lock-curtain {
      position: absolute;
      inset: 0;
      background: rgba(18, 14, 12, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: #fff;
      z-index: 10;
    }

    .time-lock-curtain h4 {
      font-size: 1.15rem;
      color: #fed7aa;
      margin-bottom: 6px;
    }

    .time-lock-curtain p {
      font-size: 0.82rem;
      color: #d1d5db;
      margin-bottom: 16px;
      max-width: 320px;
    }

    .modal-body { padding: 16px; }

    .modal-actions-row {
      display: flex;
      gap: 10px;
      margin: 12px 0;
    }

    .btn-action-outline {
      flex: 1;
      padding: 9px;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-action-outline.marked {
      background: #e8f5e9;
      border-color: #a5d6a7;
      color: #2e7d32;
    }

    .row-counter {
      background: var(--primary-soft);
      border: 1.5px dashed var(--primary);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .count-display {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
    }

    .count-btns button {
      background: #fff;
      border: 1px solid var(--border);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: 700;
      color: var(--text);
    }

    .materials-box {
      background: #faf8f5;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 0.82rem;
    }

    .materials-box h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 4px;
    }

    /* MODAL DE PLANES */
    .plans-modal-body {
      padding: 22px 16px;
      text-align: center;
    }

    .promo-banner-badge {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .plans-modal-body h3 {
      font-size: 1.25rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .plans-modal-body p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 14
