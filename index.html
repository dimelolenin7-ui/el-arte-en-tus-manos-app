<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Arte en Tus Manos | Academia de Amigurumis</title>
  
  <meta name="theme-color" content="#b35a38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #faf7f2;
      --card-bg: #ffffff;
      --primary: #b35a38;
      --primary-hover: #984627;
      --primary-soft: #fcf1eb;
      --accent: #5e7a68;
      --accent-soft: #eef4f0;
      --text: #2d2621;
      --text-muted: #7d7268;
      --border: #ede4d8;
      --shadow: 0 4px 20px -2px rgba(92, 60, 42, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.5;
      padding-bottom: 90px;
    }

    h1, h2, h3, .font-serif {
      font-family: 'Cinzel', serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Auth Screen */
    #authScreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .auth-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      text-align: center;
    }

    .auth-hero {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .auth-body {
      padding: 24px 20px;
    }

    .auth-body h1 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .auth-body p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      display: block;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .btn-main {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(179, 90, 56, 0.25);
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      color: #1e7e48;
      background: #e8f5e9;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: rgba(250, 247, 242, 0.95);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    /* Search & Filter */
    .search-bar {
      position: relative;
      margin: 12px 0 16px;
    }

    .search-bar input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Cards & Carousels */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0 10px;
    }

    .section-head h2 {
      font-size: 1.05rem;
      color: var(--text);
    }

    .carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      min-width: 210px;
      max-width: 210px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      scroll-snap-align: start;
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      height: 125px;
      background: #e2ded9;
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tag-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .tag-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .card-info {
      padding: 10px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    /* Modal Video Player */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      overflow-y: auto;
      padding: 16px;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 18px;
      max-width: 580px;
      margin: 20px auto;
      overflow: hidden;
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .modal-body {
      padding: 18px;
    }

    /* Counter tool */
    .row-counter {
      background: var(--primary-soft);
      border: 1px dashed var(--primary);
      border-radius: 12px;
      padding: 14px;
      margin: 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .count-display {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .count-btns button {
      background: #fff;
      border: 1px solid var(--border);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1: ACCESO -->
  <section id="authScreen">
    <div class="auth-card">
      <img src="https://images.unsplash.com/photo-1584992236310-6edddc08acff?auto=format&fit=crop&w=700&q=80" alt="Lanas y amigurumis" class="auth-hero">
      <div class="auth-body">
        <h1>El Arte en Tus Manos</h1>
        <p>Tu plataforma interactiva con todos los tutoriales y patrones en un solo lugar.</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="input-group">
            <label for="emailInput">Tu correo electrónico</label>
            <input type="email" id="emailInput" placeholder="alumna@ejemplo.com" required>
          </div>
          <button type="submit" class="btn-main">Entrar a la Academia</button>
        </form>

        <a href="https://wa.me/" target="_blank" class="btn-whatsapp">
          <span>💬 ¿Dudas con tu acceso? Escríbenos a WhatsApp</span>
        </a>
      </div>
    </div>
  </section>

  <!-- PANTALLA 2: CONTENIDO PRINCIPAL -->
  <main id="appScreen" style="display: none;">
    <header class="top-bar">
      <div>
        <div class="brand-title">El Arte en Tus Manos</div>
        <div style="font-size: 0.65rem; color: var(--text-muted); letter-spacing: 0.5px;">TECNOLOGÍA DL COMPANY</div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Salir</button>
    </header>

    <div class="container">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar amigurumi, técnica o patrón..." onkeyup="filterVideos()">
      </div>

      <div class="section-head">
        <h2>Principiantes desde Cero</h2>
      </div>
      <div class="carousel" id="listPrincipiantes"></div>

      <div class="section-head">
        <h2>Figuras y Santos</h2>
      </div>
      <div class="carousel" id="listSantos"></div>
    </div>
  </main>

  <!-- REPRODUCTOR INTERACTIVO Y CONTADOR -->
  <div id="videoModal" class="modal">
    <div class="modal-content">
      <div class="video-frame" id="playerContainer"></div>
      <div class="modal-body">
        <h3 id="modalTitle" style="font-size: 1.1rem; margin-bottom: 6px;"></h3>
        <p id="modalCategory" style="font-size: 0.8rem; color: var(--text-muted);"></p>

        <!-- Contador de vueltas/rondas -->
        <div class="row-counter">
          <div>
            <div style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700;">Contador de Vueltas</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Teje sin perder la cuenta</div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="count-display" id="roundNumber">0</div>
            <div class="count-btns">
              <button onclick="updateRounds(-1)">−</button>
              <button onclick="updateRounds(1)">+</button>
            </div>
          </div>
        </div>

        <button class="btn-main" onclick="closeModal()">Volver a la galería</button>
      </div>
    </div>
  </div>

  <script>
    const videos = [
      { id: "1", title: "Materiales básicos y primer anillo mágico", cat: "Principiantes", yt: "K9gA-gqM94g", duration: "12:45" },
      { id: "2", title: "Punto bajo perfecto y aumento invisible", cat: "Principiantes", yt: "dQw4w9WgXcQ", duration: "18:20" },
      { id: "3", title: "Virgen María Amigurumi - Paso a Paso", cat: "Santos", yt: "b1fb041c-0", duration: "35:10" },
      { id: "4", title: "San José con túnica y báculo", cat: "Santos", yt: "K9gA-gqM94g", duration: "42:15" }
    ];

    let currentRounds = 0;

    function init() {
      const user = localStorage.getItem('user_email');
      if (user) {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'block';
        renderCards();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      if (email) {
        localStorage.setItem('user_email', email);
        init();
      }
    }

    function handleLogout() {
      localStorage.removeItem('user_email');
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('authScreen').style.display = 'flex';
    }

    function renderCards() {
      const listP = document.getElementById('listPrincipiantes');
      const listS = document.getElementById('listSantos');
      listP.innerHTML = '';
      listS.innerHTML = '';

      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openVideo(v);
        card.innerHTML = `
          <div class="thumb-wrapper">
            <span class="tag-badge">${v.cat}</span>
            <span class="tag-duration">${v.duration}</span>
            <img src="https://images.unsplash.com/photo-1615800001619-4c6bc18ea863?auto=format&fit=crop&w=400&q=80" alt="${v.title}">
          </div>
          <div class="card-info">
            <div class="card-title">${v.title}</div>
          </div>
        `;
        if (v.cat === 'Principiantes') listP.appendChild(card);
        else listS.appendChild(card);
      });
    }

    function openVideo(video) {
      document.getElementById('modalTitle').innerText = video.title;
      document.getElementById('modalCategory').innerText = video.cat;
      currentRounds = parseInt(localStorage.getItem('round_' + video.id) || '0');
      document.getElementById('roundNumber').innerText = currentRounds;

      document.getElementById('playerContainer').innerHTML = `
        <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${video.yt}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      `;
      document.getElementById('videoModal').style.display = 'block';
    }

    function updateRounds(delta) {
      currentRounds = Math.max(0, currentRounds + delta);
      document.getElementById('roundNumber').innerText = currentRounds;
    }

    function closeModal() {
      document.getElementById('videoModal').style.display = 'none';
      document.getElementById('playerContainer').innerHTML = '';
    }

    window.onload = init;
  </script>
</body>
</html>
